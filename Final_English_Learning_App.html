        // Initialize voice selection - prefer offline/local English voices to avoid GFW blocking
        function initVoices() {
            const voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;

            // Priority: local en-US > local en-GB > local en-* > any en-*
            const localEnUS = voices.find(v => v.lang === 'en-US' && v.localService);
            const localEnGB = voices.find(v => v.lang === 'en-GB' && v.localService);
            const localEn = voices.find(v => v.lang.startsWith('en') && v.localService);
            const anyEnUS = voices.find(v => v.lang === 'en-US');
            const anyEn = voices.find(v => v.lang.startsWith('en'));

            selectedVoice = localEnUS || localEnGB || localEn || anyEnUS || anyEn || null;
            if (selectedVoice) {
                console.log('Selected English voice:', selectedVoice.name, selectedVoice.lang, 'local:', selectedVoice.localService);
            }
        }
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = initVoices;
            initVoices(); // Also try immediate init (some browsers cache voices)

        // Play audio via Baidu TTS API (free, works in China)
        function playBaiduTTS(text, isChinese = false) {
            return new Promise((resolve, reject) => {
                const cacheKey = text + (isChinese ? '_zh' : '_en');
                if (audioCache.has(cacheKey)) {
                    const audio = new Audio(URL.createObjectURL(audioCache.get(cacheKey)));
                    audio.onended = () => resolve();
                    audio.onerror = () => reject(new Error('Audio playback failed'));
                    audio.play().catch(reject);
                    return;
                }

                const lang = isChinese ? 'zh' : 'en';
                const url = `https://fanyi.baidu.com/gettts?lan=${lang}&text=${encodeURIComponent(text)}&spd=3&source=web`;

                fetch(url)
                    .then(response => {
                        if (!response.ok) throw new Error('Baidu TTS fetch failed');
                        return response.blob();
                    })
                    .then(blob => {
                        audioCache.set(cacheKey, blob);
                        const audio = new Audio(URL.createObjectURL(blob));
                        audio.onended = () => resolve();
                        audio.onerror = () => reject(new Error('Audio playback failed'));
                        audio.play().catch(reject);
                    })
                    .catch(reject);
            });
        }

        // Try SpeechSynthesis with selected voice, returns Promise
        function trySpeechSynthesis(text, lang = 'en-US') {
            return new Promise((resolve, reject) => {
                if (!window.speechSynthesis) {
                    reject(new Error('SpeechSynthesis not supported'));
                    return;
                }
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.8;
                utterance.pitch = lang === 'en-US' ? 1.1 : 1.0;
                utterance.volume = 1.0;
                if (selectedVoice && lang.startsWith('en')) {
                    utterance.voice = selectedVoice;
                }

                let hasEnded = false;
                utterance.onerror = (e) => {
                    if (!hasEnded) {
                        hasEnded = true;
                        reject(new Error(e.error || 'SpeechSynthesis error'));
                    }
                };

                // Timeout: if no sound in 5 seconds, consider it failed (GFW blocking)
                const timeout = setTimeout(() => {
                    if (!hasEnded) {
                        hasEnded = true;
                        window.speechSynthesis.cancel();
                        reject(new Error('SpeechSynthesis timeout'));
                    }
                }, 5000);

                utterance.onend = () => {
                    clearTimeout(timeout);
                    if (!hasEnded) { hasEnded = true; resolve(); }
                };

                window.speechSynthesis.speak(utterance);
            });

    <script>
        let currentGrade = null;

        let totalCoins = 0;

        let spellingWords = [];

        let spellingScore = 0;
        let currentSpellingOptions = [];
        let spellingAnswerLocked = false;
        let spellingAdvanceTimer = null;

        // Error book globals
        let errorBook = JSON.parse(localStorage.getItem('errorBook')) || {};
        let errorPracticeWords = [];
        let errorPracticeIndex = 0;
        let errorPracticeScore = 0;
        let errorPracticeGrade = null;
        let errorPracticeSemester = null;
        let errorPracticeUnit = null;

        // Pronunciation system globals
        let selectedVoice = null;
        const audioCache = new Map();
        let isPronouncing = false;
        let answerReviewGeneration = 0;

        function waitForReview(milliseconds) {
            return new Promise(resolve => setTimeout(resolve, milliseconds));
        }

        async function speakReviewPart(text, lang, isChinese, generation) {
            if (!text || generation !== answerReviewGeneration) return false;
            try {
                await trySpeechSynthesis(text, lang);
                return generation === answerReviewGeneration;
            } catch (speechError) {
                if (generation !== answerReviewGeneration) return false;
                try {
                    await playBaiduTTS(text, isChinese);
                    return generation === answerReviewGeneration;
                } catch (ttsError) {
                    console.log('Answer review pronunciation failed:', ttsError.message);
                    return false;
                }
            }
        }

        // Read the learned pair in a fixed order after every completed question.
        async function speakAnswerReview(word, statusElementId) {
            if (!word) return false;
            const generation = ++answerReviewGeneration;
            const statusElement = document.getElementById(statusElementId);
            const setStatus = text => {
                if (statusElement && generation === answerReviewGeneration) statusElement.textContent = text;
            };

            setStatus(`🔊 英文：${word.english}`);
            await speakReviewPart(word.english, 'en-US', false, generation);
            if (generation !== answerReviewGeneration) return false;

            await waitForReview(180);
            setStatus(`🔊 中文：${word.chinese}`);
            await speakReviewPart(word.chinese, 'zh-CN', true, generation);
            if (generation !== answerReviewGeneration) return false;

            setStatus(`✅ ${word.english}：${word.chinese}`);
            return true;
        }

        const WORD_ATLAS_UNIT_LAYOUTS = [
            ['grade1', '上学期', 'unit1', 'grade1Unit1', 4, 3, 'assets/unit1-vocabulary-atlas.png'],
            ['grade1', '上学期', 'unit2', 'g1s1unit2', 4, 3, 'assets/g1-s1-unit2-atlas.png'],
            ['grade1', '上学期', 'unit3', 'g1s1unit3', 4, 4, 'assets/g1-s1-unit3-atlas.png'],
            ['grade1', '上学期', 'unit4', 'g1s1unit4', 5, 4, 'assets/g1-s1-unit4-atlas.png'],
            ['grade1', '上学期', 'unit5', 'g1s1unit5', 4, 3, 'assets/g1-s1-unit5-atlas.png'],
            ['grade1', '上学期', 'unit6', 'g1s1unit6', 4, 4, 'assets/g1-s1-unit6-atlas.png'],
            ['grade1', '下学期', 'unit1', 'g1s2unit1', 4, 3, 'assets/g1-s2-unit1-atlas.png'],

            ['grade1', '下学期', 'unit6', 'g1s2unit6', 4, 4, 'assets/g1-s2-unit6-atlas.png'],
            ['grade2', '上学期', 'unit1', 'g2s1unit1', 4, 4, 'assets/g2-s1-unit1-atlas.png'],
            ['grade2', '上学期', 'unit2', 'g2s1unit2', 4, 4, 'assets/g2-s1-unit2-atlas.png'],
            ['grade2', '上学期', 'unit3', 'g2s1unit3', 4, 3, 'assets/g2-s1-unit3-atlas.png'],
            ['grade2', '上学期', 'unit4', 'g2s1unit4', 4, 3, 'assets/g2-s1-unit4-atlas.png'],
            ['grade2', '上学期', 'unit5', 'g2s1unit5', 4, 3, 'assets/g2-s1-unit5-atlas.png'],
            ['grade2', '上学期', 'unit6', 'g2s1unit6', 4, 3, 'assets/g2-s1-unit6-atlas.png'],
            ['grade2', '下学期', 'unit1', 'g2s2unit1', 4, 3, 'assets/g2-s2-unit1-atlas.png'],
            ['grade2', '下学期', 'unit2', 'g2s2unit2', 4, 3, 'assets/g2-s2-unit2-atlas.png'],
            ['grade2', '下学期', 'unit3', 'g2s2unit3', 4, 3, 'assets/g2-s2-unit3-atlas.png'],
            ['grade2', '下学期', 'unit4', 'g2s2unit4', 4, 4, 'assets/g2-s2-unit4-atlas.png'],
            ['grade2', '下学期', 'unit5', 'g2s2unit5', 4, 3, 'assets/g2-s2-unit5-atlas.png'],
            ['grade2', '下学期', 'unit6', 'g2s2unit6', 4, 3, 'assets/g2-s2-unit6-atlas.png']
        ];

        const WORD_IMAGE_ATLASES = Object.fromEntries(
            WORD_ATLAS_UNIT_LAYOUTS.map(([, , , atlasKey, columns, rows, src]) => [
                atlasKey,
                { src, columns, rows }
            ])
        );

        WORD_ATLAS_UNIT_LAYOUTS.forEach(([grade, semester, unit, atlasKey]) => {
            (VOCABULARY[grade]?.[semester]?.[unit] || []).forEach((word, imageIndex) => {
                word.imageAtlas = atlasKey;
                word.imageIndex = imageIndex;
            });
        });

        function getWordImageStyle(word) {
            const atlas = word && WORD_IMAGE_ATLASES[word.imageAtlas];
            if (!atlas || !Number.isInteger(word.imageIndex)) return null;

            const column = word.imageIndex % atlas.columns;
            const row = Math.floor(word.imageIndex / atlas.columns);
            if (row >= atlas.rows) return null;

            const positionX = atlas.columns === 1 ? 0 : (column / (atlas.columns - 1)) * 100;
            const positionY = atlas.rows === 1 ? 0 : (row / (atlas.rows - 1)) * 100;
            return {
                imageUrl: `url('${atlas.src}')`,
                imageSize: `${atlas.columns * 100}% ${atlas.rows * 100}%`,
                positionX: `${positionX}%`,
                positionY: `${positionY}%`,
                aspectRatio: `${atlas.rows} / ${atlas.columns}`
            };
        }

        function applyWordVisual(element, word, fallbackEmoji = '📝') {
            if (!element) return;
            const imageStyle = getWordImageStyle(word);
            element.classList.remove('has-word-image');
            element.style.removeProperty('--word-image-url');
            element.style.removeProperty('--word-image-size');
            element.style.removeProperty('--word-image-position-x');
            element.style.removeProperty('--word-image-position-y');
            element.style.removeProperty('--word-image-aspect');

            if (!imageStyle) {
                element.textContent = (word && word.emoji) || fallbackEmoji;
                return;
            }

            element.textContent = '';
            element.classList.add('has-word-image');
            element.style.setProperty('--word-image-url', imageStyle.imageUrl);
            element.style.setProperty('--word-image-size', imageStyle.imageSize);
            element.style.setProperty('--word-image-position-x', imageStyle.positionX);
            element.style.setProperty('--word-image-position-y', imageStyle.positionY);
            element.style.setProperty('--word-image-aspect', imageStyle.aspectRatio);
        }

        function getWordVisualMarkup(word, className, fallbackEmoji = '📝') {
            const imageStyle = getWordImageStyle(word);
            if (!imageStyle) {
                return `<span class="${className}">${(word && word.emoji) || fallbackEmoji}</span>`;
            }
            return `<span class="${className} has-word-image" style="--word-image-url:${imageStyle.imageUrl};--word-image-size:${imageStyle.imageSize};--word-image-position-x:${imageStyle.positionX};--word-image-position-y:${imageStyle.positionY};--word-image-aspect:${imageStyle.aspectRatio}"></span>`;
        }

        function selectGrade(grade) {
            currentGrade = grade;
            document.querySelectorAll('.btn-grade1, .btn-grade2').forEach(btn => {

            if (!currentGrade || !currentSemester || !currentUnit) {
                alert('请先选择年级、学期和单元！');

        function displayWord() {
            if (currentWordIndex >= currentWords.length) {

            }

            const word = currentWords[currentWordIndex];

                <div class="word-emoji hidden" id="word-emoji"></div>

                <div class="word-example-container hidden" id="word-example-container">
                    <div class="word-example" id="word-example">${word.example || ''}</div>

                </div>
                <div class="word-example-chinese hidden" id="word-example-chinese">${word.exampleChinese || ''}</div>
            `;

        function toggleChinese() {
            const chineseElement = document.getElementById('chinese-meaning');

        function shuffleSpellingItems(items) {
            const shuffled = [...items];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function preserveLetterCase(source, replacement) {
            return source === source.toUpperCase() ? replacement.toUpperCase() : replacement;
        }

        // Generate near-miss spellings with one small change so every option looks plausible.
        function generateSpellingOptions(correctWord, optionCount = 4) {
            const correct = correctWord.trim();
            const normalizedCorrect = correct.toLowerCase();
            const candidates = new Set();
            const similarLetters = {
                a: ['e', 'o'], b: ['d', 'p'], c: ['k', 's'], d: ['b', 't'],
                e: ['a', 'i'], f: ['v'], g: ['j', 'q'], h: ['n'],
                i: ['e', 'y'], j: ['g'], k: ['c'], l: ['i'], m: ['n'],
                n: ['m', 'h'], o: ['a', 'u'], p: ['b', 'q'], q: ['g', 'p'],
                r: ['n'], s: ['c', 'z'], t: ['d', 'f'], u: ['o'],
                v: ['f', 'w'], w: ['v'], x: ['s'], y: ['i'], z: ['s']
            };

            function addCandidate(candidate) {
                const cleaned = candidate.trim().replace(/\s{2,}/g, ' ');
                if (cleaned && cleaned.toLowerCase() !== normalizedCorrect) {
                    candidates.add(cleaned);
                }
            }

            const letterCount = (correct.match(/[a-z]/gi) || []).length;
            for (let i = 0; i < correct.length; i++) {
                const char = correct[i];
                if (!/[a-z]/i.test(char)) continue;

                if (letterCount > 2) {
                    addCandidate(correct.slice(0, i) + correct.slice(i + 1));
                }

                addCandidate(correct.slice(0, i + 1) + char + correct.slice(i + 1));

                const nextChar = correct[i + 1];
                if (nextChar && /[a-z]/i.test(nextChar) && char.toLowerCase() !== nextChar.toLowerCase()) {
                    addCandidate(correct.slice(0, i) + nextChar + char + correct.slice(i + 2));
                }

                (similarLetters[char.toLowerCase()] || []).forEach(replacement => {
                    addCandidate(correct.slice(0, i) + preserveLetterCase(char, replacement) + correct.slice(i + 1));
                });
            }

            if (correct.includes(' ')) addCandidate(correct.replace(' ', ''));
            if (correct.includes("'")) addCandidate(correct.replace("'", ''));

            ['a', 'e', 'i', 'o', 'u', 'l'].forEach(letter => {
                if (correct.length === 1) addCandidate(preserveLetterCase(correct, letter));
            });

            const distractors = shuffleSpellingItems([...candidates]).slice(0, optionCount - 1);
            return shuffleSpellingItems([correct, ...distractors]);
        }

        function displaySpellingQuestion() {
            if (currentSpellingIndex >= spellingWords.length) {
                finishSpelling();
                return;
            }

            const word = spellingWords[currentSpellingIndex];
            const feedback = document.getElementById('spelling-feedback');
            feedback.textContent = '';
            feedback.className = 'spelling-feedback';
            spellingAnswerLocked = false;
            document.getElementById('spelling-review-status').textContent = '';

            document.getElementById('spelling-word-chinese').textContent = `中文意思: ${word.chinese}`;
            document.getElementById('spelling-word-pronunciation').textContent = `发音: /${word.pronunciation}/`;
            applyWordVisual(document.getElementById('spelling-emoji'), word, '🔤');

            currentSpellingOptions = generateSpellingOptions(word.english);
            const optionsContainer = document.getElementById('spelling-options');
            optionsContainer.innerHTML = '';
            const optionLabels = ['A', 'B', 'C', 'D'];

            currentSpellingOptions.forEach((option, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'spelling-option';
                button.dataset.answer = option;
                button.setAttribute('aria-label', `选项 ${optionLabels[index]}，${option}`);

                const label = document.createElement('span');
                label.className = 'spelling-option-label';
                label.textContent = optionLabels[index];

                const wordText = document.createElement('span');
                wordText.className = 'spelling-option-word';
                wordText.textContent = option;

                button.append(label, wordText);
                button.onclick = () => checkSpellingAnswer(option, button);
                optionsContainer.appendChild(button);
            });

            document.getElementById('spelling-skip-btn').disabled = false;
            document.getElementById('spelling-pronounce-btn').disabled = false;

            updateSpellingProgress();
        }

        function checkSpellingAnswer(selectedAnswer, selectedButton) {
            if (spellingAnswerLocked) return;
            spellingAnswerLocked = true;

            const word = spellingWords[currentSpellingIndex];
            const correctAnswer = word.english.toLowerCase();
            const feedback = document.getElementById('spelling-feedback');
            const isCorrect = selectedAnswer.toLowerCase() === correctAnswer;

            document.querySelectorAll('#spelling-options .spelling-option').forEach(button => {
                button.disabled = true;
                if (button.dataset.answer.toLowerCase() === correctAnswer) {
                    button.classList.add('correct');
                    button.querySelector('.spelling-option-label').textContent = '✓';
                }
            });
            document.getElementById('spelling-skip-btn').disabled = true;
            document.getElementById('spelling-pronounce-btn').disabled = true;

            if (isCorrect) {
                feedback.textContent = `✅ 正确！"${word.english}" 拼写正确！`;
                feedback.className = 'spelling-feedback correct';
                playSound(true);
                spellingScore++;
                document.getElementById('spelling-score-display').textContent = `正确: ${spellingScore}`;
                totalCoins++;
                updateCoinDisplay();
            } else {
                selectedButton.classList.add('incorrect');
                selectedButton.querySelector('.spelling-option-label').textContent = '×';
                feedback.textContent = `再仔细看看：你选了“${selectedAnswer}”，正确拼写是“${word.english}”。`;
                feedback.className = 'spelling-feedback incorrect';
                playSound(false);
                // Save to error book
                saveToErrorBook(currentGrade, currentSemester, currentUnit, 'spelling', word, selectedAnswer);
            }

            const answeredIndex = currentSpellingIndex;
            speakAnswerReview(word, 'spelling-review-status').finally(() => {
                if (!spellingAnswerLocked || currentSpellingIndex !== answeredIndex || document.getElementById('spelling-mode').classList.contains('hidden')) return;
                spellingAdvanceTimer = setTimeout(() => {
                    currentSpellingIndex++;
                    displaySpellingQuestion();
                }, 400);
            });
        }

        function generateComprehensiveQuiz(words) {
            const questions = [];
            // Use all words from current unit to match learning mode exactly
            const selectedWords = [...words].sort(() => Math.random() - 0.5);

            selectedWords.forEach(word => {
                questions.push({
                    word: word,
                    isChineseToEnglish: true,
                    questionText: `"${word.chinese}"的英文单词是什么？`,
                    correctAnswer: word.english,
                    options: generateOptionsForWord(word, 'english')
                });

                questions.push({
                    word: word,
                    isChineseToEnglish: false,
                    questionText: `"${word.english}"的中文意思是什么？`,
                    correctAnswer: word.chinese,
                    options: generateOptionsForWord(word, 'chinese')
                });
            });

            return questions.sort(() => Math.random() - 0.5);
        }

        function generateOptionsForWord(targetWord, answerType) {
            const allWords = getCurrentWords(currentGrade, currentSemester, currentUnit);
            const options = [];

            const correctText = answerType === 'english' ? targetWord.english : targetWord.chinese;
            options.push({
                text: correctText,
                correct: true
            });

            const wrongOptions = [];
            const availableWords = allWords.filter(word => {
                return word.english !== targetWord.english && word.chinese !== targetWord.chinese;
            });

            const selectedWrongWords = [...availableWords].sort(() => Math.random() - 0.5).slice(0, 3);

            selectedWrongWords.forEach(word => {
                const wrongText = answerType === 'english' ? word.english : word.chinese;
                if (wrongText !== correctText) {
                    wrongOptions.push({
                        text: wrongText,
                        correct: false
                    });
                }
            });

            while (wrongOptions.length < 3) {
                const fallbackText = answerType === 'english' ? '???' : '？？？';
                wrongOptions.push({
                    text: fallbackText,
                    correct: false
                });
            }

            options.push(...wrongOptions);
            return options.sort(() => Math.random() - 0.5);
        }

        function playSound(isCorrect) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();

            if (isCorrect) {
                const frequencies = [523.25, 659.25, 783.99];
                frequencies.forEach((freq, index) => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.frequency.value = freq;
                    oscillator.type = 'sine';

                    const startTime = audioContext.currentTime + index * 0.1;
                    const endTime = startTime + 0.2;

                    gainNode.gain.setValueAtTime(0.3, startTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, endTime);

                    oscillator.start(startTime);
                    oscillator.stop(endTime);
                });
            } else {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = 400;
                oscillator.type = 'sine';

                const startTime = audioContext.currentTime;
                const endTime = startTime + 0.5;

                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, endTime);

                oscillator.start(startTime);
                oscillator.stop(endTime);

                const oscillator2 = audioContext.createOscillator();
                const gainNode2 = audioContext.createGain();
                oscillator2.connect(gainNode2);
                gainNode2.connect(audioContext.destination);

                oscillator2.frequency.value = 300;
                oscillator2.type = 'sine';

                const startTime2 = audioContext.currentTime + 0.1;
                const endTime2 = startTime2 + 0.4;

                gainNode2.gain.setValueAtTime(0.3, startTime2);
                gainNode2.gain.exponentialRampToValueAtTime(0.01, endTime2);

                oscillator2.start(startTime2);
                oscillator2.stop(endTime2);
            }
        }

        function saveToErrorBook(grade, semester, unit, mode, word, wrongAnswer) {
            if (!errorBook[grade]) errorBook[grade] = {};
            if (!errorBook[grade][semester]) errorBook[grade][semester] = {};
            if (!errorBook[grade][semester][unit]) errorBook[grade][semester][unit] = { quiz: [], spelling: [] };

            const entry = {
                word: word,
                wrongAnswer: wrongAnswer,
                timestamp: Date.now()
            };

            // Don't add duplicate entries for the same word in the same mode
            const existing = errorBook[grade][semester][unit][mode];
            const isDuplicate = existing.some(e => e.word.english === word.english);
            if (!isDuplicate) {
                existing.push(entry);
                localStorage.setItem('errorBook', JSON.stringify(errorBook));
            }
        }

        function toggleSection(element) {
            const content = element.nextElementSibling;
            const arrow = element.querySelector('span');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                if (arrow) arrow.textContent = '▼';
            } else {
                content.style.display = 'none';
                if (arrow) arrow.textContent = '▶';
            }
        }

        function practiceUnitErrors(grade, semester, unit) {
            const unitData = errorBook[grade]?.[semester]?.[unit];
            if (!unitData) return;

            // Collect all unique words from both quiz and spelling errors
            const seenWords = new Set();
            errorPracticeWords = [];

            (unitData.quiz || []).forEach(err => {
                if (!seenWords.has(err.word.english)) {
                    seenWords.add(err.word.english);
                    errorPracticeWords.push({ ...err, mode: 'quiz' });
                }
            });
            (unitData.spelling || []).forEach(err => {
                if (!seenWords.has(err.word.english)) {
                    seenWords.add(err.word.english);
                    errorPracticeWords.push({ ...err, mode: 'spelling' });
                }
            });

            // Shuffle
            errorPracticeWords.sort(() => Math.random() - 0.5);
            errorPracticeIndex = 0;
            errorPracticeScore = 0;
            errorPracticeGrade = grade;
            errorPracticeSemester = semester;
            errorPracticeUnit = unit;
            errorPracticeAnswerLocked = false;
            clearTimeout(errorPracticeAdvanceTimer);
            answerReviewGeneration++;
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            document.getElementById('error-book-mode').classList.add('hidden');
            document.getElementById('error-practice-mode').classList.remove('hidden');

            const unitNames = { unit1: 'Unit 1', unit2: 'Unit 2', unit3: 'Unit 3', unit4: 'Unit 4', unit5: 'Unit 5', unit6: 'Unit 6' };
            document.getElementById('error-practice-unit-label').textContent = `${unitNames[unit] || unit} - ${errorPracticeWords.length} 道错题`;

            displayErrorPracticeQuestion();
        }

            errorPracticeAnswerLocked = true;

            const correctAnswer = entry.word.english.toLowerCase();

            document.querySelectorAll('#error-practice-options .error-practice-option').forEach(button => {
                button.disabled = true;

        function removeFromErrorBook(grade, semester, unit, mode, word) {
            const entries = errorBook[grade]?.[semester]?.[unit]?.[mode];
            if (!entries) return;
            const idx = entries.findIndex(e => e.word.english === word.english);
            if (idx >= 0) {
                entries.splice(idx, 1);
            }
            // Clean up empty containers
            if (entries.length === 0) {
                delete errorBook[grade][semester][unit][mode];
            }
            if (Object.keys(errorBook[grade][semester][unit]).every(k => errorBook[grade][semester][unit][k].length === 0)) {
                delete errorBook[grade][semester][unit];
            }
            if (Object.keys(errorBook[grade][semester]).length === 0) {
                delete errorBook[grade][semester];
            }
            if (Object.keys(errorBook[grade]).length === 0) {
                delete errorBook[grade];
            }
            localStorage.setItem('errorBook', JSON.stringify(errorBook));
        }

        function updateWrongAnswerInErrorBook(grade, semester, unit, mode, word, wrongAnswer) {
            const entries = errorBook[grade]?.[semester]?.[unit]?.[mode];
            if (!entries) return;
            const entry = entries.find(e => e.word.english === word.english);
            if (entry) {
                entry.wrongAnswer = wrongAnswer;
                entry.timestamp = Date.now();
                localStorage.setItem('errorBook', JSON.stringify(errorBook));
            }
        }

        function clearUnitErrors(grade, semester, unit) {
            if (confirm('确定要清空该单元的所有错题吗？此操作不可恢复！')) {
                if (errorBook[grade]?.[semester]) {
                    delete errorBook[grade][semester][unit];
                    if (Object.keys(errorBook[grade][semester]).length === 0) {
                        delete errorBook[grade][semester];
                    }
                    if (Object.keys(errorBook[grade]).length === 0) {
                        delete errorBook[grade];
                    }
                }
                localStorage.setItem('errorBook', JSON.stringify(errorBook));
                renderErrorBook();
            }
        }

        function clearAllErrors() {
            if (confirm('确定要清空所有错题吗？此操作不可恢复！')) {
                errorBook = {};
                localStorage.setItem('errorBook', JSON.stringify(errorBook));
                renderErrorBook();
            }
        }

        function backToErrorBook() {
            clearTimeout(errorPracticeAdvanceTimer);
            errorPracticeAnswerLocked = false;
            answerReviewGeneration++;
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            document.getElementById('error-practice-mode').classList.add('hidden');
            document.getElementById('error-book-mode').classList.remove('hidden');
            errorPracticeWords = [];
            renderErrorBook();
        }

        // ============ End Error Book Functions ============

        function backToSelection() {
            clearTimeout(spellingAdvanceTimer);
            clearTimeout(quizAdvanceTimer);
            clearTimeout(errorPracticeAdvanceTimer);
            spellingAnswerLocked = false;
            quizAnswerLocked = false;
            errorPracticeAnswerLocked = false;
            answerReviewGeneration++;
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            document.querySelectorAll('.quiz-remember-btn').forEach(button => button.remove());
            document.getElementById('selection-screen').classList.remove('hidden');
            document.getElementById('learning-mode').classList.add('hidden');
            document.getElementById('quiz-mode').classList.add('hidden');
            document.getElementById('spelling-mode').classList.add('hidden');
            document.getElementById('error-book-mode').classList.add('hidden');
            document.getElementById('error-practice-mode').classList.add('hidden');
            spellingWords = [];
        }

        // Shop functionality
        const SHOP_ITEMS = [
            { name: '学习徽章', price: 50, category: 'collection', rarity: 'starter', imageIndex: 0, desc: '完成学习目标的第一枚勋章' },
            { name: '小星星贴纸', price: 75, category: 'collection', rarity: 'starter', imageIndex: 1, desc: '把闪亮星星收入收藏册' },
            { name: '彩色铅笔', price: 100, category: 'learning', rarity: 'starter', imageIndex: 2, desc: '画出今天学会的新单词' },
            { name: '迷你词典', price: 150, category: 'learning', rarity: 'starter', imageIndex: 3, desc: '随时发现陌生单词的秘密' },
            { name: '英语故事书', price: 175, category: 'learning', rarity: 'popular', imageIndex: 4, desc: '开启一段有趣的英文冒险' },
            { name: '单词卡片套装', price: 200, category: 'learning', rarity: 'popular', imageIndex: 5, desc: '翻一翻，记单词更轻松' },
            { name: '电子单词笔', price: 250, category: 'gear', rarity: 'popular', imageIndex: 6, desc: '点一点就能听到标准发音' },
            { name: '学习海报', price: 275, category: 'learning', rarity: 'popular', imageIndex: 7, desc: '把常用单词贴在学习角' },
            { name: '英语游戏卡', price: 300, category: 'fun', rarity: 'popular', imageIndex: 8, desc: '和家人一起玩单词挑战' },
            { name: '智能学习手表', price: 350, category: 'gear', rarity: 'popular', imageIndex: 9, desc: '记录每天坚持学习的时间' },
            { name: '火箭文具盒', price: 400, category: 'fun', rarity: 'special', imageIndex: 10, desc: '装好文具，向知识星球出发' },
            { name: '小熊书包', price: 425, category: 'gear', rarity: 'special', imageIndex: 11, desc: '背上可爱书包快乐去学习' },
            { name: '彩虹笔记本', price: 450, category: 'learning', rarity: 'special', imageIndex: 12, desc: '记录每一个进步的小瞬间' },
            { name: '字母积木', price: 475, category: 'fun', rarity: 'special', imageIndex: 13, desc: '动手搭出有趣的英文单词' },
            { name: '恐龙书签', price: 500, category: 'collection', rarity: 'special', imageIndex: 14, desc: '让小恐龙陪你继续阅读' },
            { name: '星光阅读灯', price: 550, category: 'gear', rarity: 'special', imageIndex: 15, desc: '用温暖灯光守护阅读时间' },
            { name: '太空耳机', price: 600, category: 'gear', rarity: 'legendary', imageIndex: 16, desc: '沉浸聆听清晰的英语发音' },
            { name: '单词宝藏箱', price: 650, category: 'collection', rarity: 'legendary', imageIndex: 17, desc: '收藏一路学会的单词宝藏' },
            { name: '冠军奖杯', price: 700, category: 'collection', rarity: 'legendary', imageIndex: 18, desc: '为坚持学习的自己喝彩' },
            { name: '猫头鹰学伴', price: 800, category: 'collection', rarity: 'legendary', imageIndex: 19, desc: '最珍贵的智慧学习伙伴' }
        ];
        const SHOP_RARITY_LABELS = {
            starter: '入门', popular: '人气', special: '珍藏', legendary: '传说'
        };
        const SHOP_ITEM_IMAGES = [
            'assets/shop-items/00-learning-medal.png',
            'assets/shop-items/01-star-stickers.png',
            'assets/shop-items/02-colored-pencils.png',
            'assets/shop-items/03-mini-dictionary.png',
            'assets/shop-items/04-english-storybook.png',
            'assets/shop-items/05-word-cards.png',
            'assets/shop-items/06-reading-pen.png',
            'assets/shop-items/07-learning-poster.png',
            'assets/shop-items/08-game-cards.png',
            'assets/shop-items/09-smart-watch.png',
            'assets/shop-items/10-rocket-pencil-case.png',
            'assets/shop-items/11-bear-backpack.png',
            'assets/shop-items/12-rainbow-notebook.png',
            'assets/shop-items/13-alphabet-blocks.png',
            'assets/shop-items/14-dinosaur-bookmark.png',
            'assets/shop-items/15-reading-lamp.png',
            'assets/shop-items/16-space-headphones.png',
            'assets/shop-items/17-word-treasure-box.png',
            'assets/shop-items/18-champion-trophy.png',
            'assets/shop-items/19-owl-companion.png'
        ];
        let currentShopCategory = 'all';
        let shopMessageTimer = null;

        function toggleShop() {
            document.getElementById('shop-overlay').classList.contains('active')
                ? closeFullShop()
                : openFullShop();
        }

        function openShop() {
            openFullShop();
        }

        function openFullShop() {
            const overlay = document.getElementById('shop-overlay');
            overlay.classList.add('active');
            overlay.setAttribute('aria-hidden', 'false');
            updateCoinDisplay();
            updateShopItems();
        }

        function closeShop() {
            closeFullShop();
        }

        function closeFullShop() {
            const overlay = document.getElementById('shop-overlay');
            overlay.classList.remove('active');
            overlay.setAttribute('aria-hidden', 'true');
        }

        function updateCoinDisplay() {
            document.getElementById('coin-display').textContent = `💰 金币: ${totalCoins}`;
            document.getElementById('shop-coin-balance').textContent = totalCoins;
            localStorage.setItem('totalCoins', totalCoins);
        }

        function setShopCategory(category) {
            currentShopCategory = category;
            updateShopItems();
        }

        function showShopMessage(message, type = 'success') {
            const messageElement = document.getElementById('shop-message');
            clearTimeout(shopMessageTimer);
            messageElement.className = `shop-message ${type}`;
            messageElement.textContent = message;
            shopMessageTimer = setTimeout(() => {
                messageElement.className = 'shop-message';
                messageElement.textContent = '';
            }, 2800);
        }

        function updateShopItems() {
            const shopGrid = document.getElementById('shop-items-grid');
            const visibleItems = currentShopCategory === 'all'
                ? SHOP_ITEMS
                : SHOP_ITEMS.filter(item => item.category === currentShopCategory);

            document.querySelectorAll('.shop-filter').forEach(button => {
                button.classList.toggle('active', button.dataset.category === currentShopCategory);
            });

            const purchasedCount = SHOP_ITEMS.filter(item => purchasedItems.includes(item.name)).length;
            document.getElementById('shop-progress').innerHTML = `已收藏 <strong>${purchasedCount}</strong> / ${SHOP_ITEMS.length} 件奖励`;
            shopGrid.innerHTML = '';

            visibleItems.forEach((item, visibleIndex) => {
                const purchased = purchasedItems.includes(item.name);
                const affordable = totalCoins >= item.price;
                const itemCard = document.createElement('button');
                itemCard.type = 'button';
                itemCard.className = `shop-item-card${purchased ? ' purchased' : ''}${!purchased && !affordable ? ' unaffordable' : ''}`;
                itemCard.style.setProperty('--shop-delay', `${visibleIndex * 28}ms`);
                itemCard.setAttribute('aria-label', `${item.name}，${item.price}金币${purchased ? '，已购买' : affordable ? '，可以购买' : '，金币不足'}`);
                if (purchased) {
                    itemCard.disabled = true;
                } else {
                    itemCard.onclick = () => purchaseItem(item);
                }

                itemCard.innerHTML = `
                    ${purchased ? '<span class="purchased-text">✓ 已收藏</span>' : ''}
                    <div class="shop-item-media">
                        <img class="shop-item-image" src="${SHOP_ITEM_IMAGES[item.imageIndex]}" alt="${item.name}" loading="lazy">
                    </div>
                    <div class="shop-item-body">
                        <div class="shop-item-name-row">
                            <h4 class="shop-item-name">${item.name}</h4>
                            <span class="shop-rarity rarity-${item.rarity}">${SHOP_RARITY_LABELS[item.rarity]}</span>
                        </div>
                        <p>${item.desc}</p>
                        <div class="shop-item-footer">
                            <span class="price">🪙 ${item.price}</span>
                            <span class="shop-buy-hint">${purchased ? '已拥有' : affordable ? '点击购买' : `还差 ${item.price - totalCoins}`}</span>
                        </div>
                    </div>
                `;
                shopGrid.appendChild(itemCard);
            });
        }

        function purchaseItem(item) {
            if (purchasedItems.includes(item.name)) {
                showShopMessage('这个奖励已经在你的收藏里啦！', 'warning');
                return;
            }
            if (totalCoins < item.price) {
                showShopMessage(`还差 ${item.price - totalCoins} 枚金币，再完成几道题吧！`, 'warning');
                return;
            }

            totalCoins -= item.price;
            purchasedItems.push(item.name);
            localStorage.setItem('purchasedItems', JSON.stringify(purchasedItems));
            updateCoinDisplay();
            updateShopItems();
            showShopMessage(`🎉 成功收藏「${item.name}」！`);
        }

        // Load saved data on page load
        window.addEventListener('load', function() {
            const savedCoins = Number.parseInt(localStorage.getItem('totalCoins'), 10);
            if (Number.isFinite(savedCoins)) totalCoins = savedCoins;
            const savedItems = localStorage.getItem('purchasedItems');
            if (savedItems) purchasedItems = JSON.parse(savedItems);
            updateCoinDisplay();
        });

        document.getElementById('shop-overlay').addEventListener('click', function(event) {
            if (event.target === this) closeFullShop();
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && document.getElementById('shop-overlay').classList.contains('active')) {
                closeFullShop();
            }
        });
    </script>
</body>
